<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a78d6"/>
      <stop offset="1" stop-color="#4a3aa7"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- ascending bars: grades / progress trending up -->
  <rect x="14" y="36" width="9" height="16" rx="2.5" fill="#ffffff"/>
  <rect x="27.5" y="26" width="9" height="26" rx="2.5" fill="#ffffff"/>
  <rect x="41" y="14" width="9" height="38" rx="2.5" fill="#ffffff" fill-opacity="0.92"/>
  <!-- checkmark accent tying "tracked" progress to a passed grade -->
  <path d="M41.5 21.5l3.2 3.4 6.3-7" fill="none" stroke="#4a3aa7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
