services:
  db:
    image: postgres:16-alpine
    container_name: grade-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grade_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-grade_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grade_tracker}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grade_tracker} -d ${POSTGRES_DB:-grade_tracker}"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: grade-tracker-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-grade_tracker}:${POSTGRES_PASSWORD:-grade_tracker}@db:5432/${POSTGRES_DB:-grade_tracker}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me-in-production}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5001:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5001}
    container_name: grade-tracker-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5001}
    ports:
      - "3001:3000"
    depends_on:
      - backend

volumes:
  db-data:
