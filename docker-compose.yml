services:
  backend:
    build: ./backend
    container_name: grade-tracker-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////app/instance/grades.db
    volumes:
      - backend-data:/app/instance
    ports:
      - "5001:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5001}
    container_name: grade-tracker-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5001}
    ports:
      - "3001:3000"
    depends_on:
      - backend

volumes:
  backend-data:
