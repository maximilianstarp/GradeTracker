[pytest]
# Without this, `app` (backend/app/) is only importable when pytest is
# invoked as `python -m pytest` (which auto-prepends the cwd to sys.path) -
# not with the bare `pytest` command CI uses, which resolves sys.path[0] to
# the console-script's own directory instead. Setting pythonpath explicitly
# makes both invocation styles work the same way.
pythonpath = .
